<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Wojciech Szymczak</title>
  <meta name="description" content="PhD student in Economics at Uppsala University">
  <style>
    :root { --ink: #272727; --muted: #737373; --line: #e5e5e5; --accent: #206a5d; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.68; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .site-panel { position: fixed; inset: 0 auto 0 0; width: 330px; padding: 4.5rem 3.25rem 2.5rem; border-right: 1px solid var(--line); background: #fafafa; text-align: center; overflow-y: auto; }
    .profile-photo { width: 108px; height: 108px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 1.25rem; }
    .site-panel h1 { margin: 0; font-family: Georgia, serif; font-size: 1.82rem; font-weight: 500; line-height: 1.18; }
    .role { margin: .8rem 0 1.65rem; color: var(--muted); font-size: .95rem; line-height: 1.45; }
    .rule { border: 0; border-top: 1px solid var(--line); margin: 1.3rem 0; }
    .site-nav { display: grid; gap: .5rem; }
    .site-nav a { color: var(--ink); font-size: .96rem; }
    .site-nav a:hover { color: var(--accent); text-decoration: none; }
    .social { display: flex; justify-content: center; gap: 1rem; font-size: .92rem; }
    .page { margin-left: 330px; }
    .content { max-width: 770px; padding: 5rem 4rem; }
    .content h2 { margin: 3.15rem 0 1rem; padding-bottom: .55rem; border-bottom: 1px solid var(--line); font-family: Georgia, serif; font-size: 1.55rem; font-weight: 500; }
    .content h2:first-child { margin-top: 0; }
    .content h3 { margin: 1.65rem 0 .35rem; font-size: 1.03rem; font-weight: 650; }
    .content p { margin: 0 0 1.1rem; }
    .content ul { margin: .4rem 0 0; padding-left: 1.25rem; }
    .content li { margin-bottom: .6rem; }
    .intro { font-family: Georgia, serif; font-size: 1.3rem; line-height: 1.6; color: #414141; }
    .copyright { margin-top: 2.5rem; color: var(--muted); font-size: .82rem; }
    @media (max-width: 780px) {
      .site-panel { position: static; width: 100%; padding: 2.5rem 1.5rem; border-right: 0; border-bottom: 1px solid var(--line); }
      .page { margin-left: 0; }
      .content { max-width: 700px; padding: 2.75rem 1.5rem; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <aside class="site-panel">
    <a href="/"><img class="profile-photo" src="/images/Szymczak_ZDJ.jpg" alt="Portrait of Wojciech Szymczak"></a>
    <h1><a href="/">Wojciech Szymczak</a></h1>
    <p class="role">PhD student in Economics<br>Uppsala University</p>
    <hr class="rule">
    <nav class="site-nav" aria-label="Site navigation">
      <a href="#about">About</a>
      <a href="#research">Research</a>
      <a href="#contact">Contact</a>
      <a href="/files/CV_Szymczak.pdf">CV</a>
    </nav>
    <hr class="rule">
    <div class="social">
      <a href="mailto:wojciech.szymczak@nek.uu.se">Email</a>
      <a href="https://scholar.google.com/citations?user=w1tir28AAAAJ&amp;hl=pl">Scholar</a>
      <a href="https://github.com/szymczakwojciech">GitHub</a>
    </div>
  </aside>
  <main class="page">
    <article class="content">
      {{ content }}
      <p class="copyright">© {{ site.time | date: '%Y' }} Wojciech Szymczak</p>
    </article>
  </main>
</body>
</html>
